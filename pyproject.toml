[project]
name = "philanthra"
version = "0.1.0"
description = "Permissioned philanthropic intelligence pilot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "django>=5.2.11,<5.3",
  "djangorestframework>=3.16,<3.18",
  "drf-spectacular>=0.28,<0.30",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<26",
  "defusedxml>=0.7.1,<0.8",
  "openpyxl>=3.1.5,<3.2",
  "pypdf>=6.19,<7",
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-django>=4.11,<5", "pytest-cov>=6,<8",
  "hypothesis>=6.130,<7", "ruff>=0.12,<1", "mypy>=1.15,<2",
  "django-stubs>=5.2,<5.3", "types-requests>=2.32,<3", "pip-audit>=2.9,<3"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["apps/api"]
testpaths = ["tests", "apps/api/philanthra"]
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers"
markers = ["postgres: requires PostgreSQL", "live: explicitly enabled live source/provider smoke"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".tools", "**/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations", ".venv", ".tools"]
